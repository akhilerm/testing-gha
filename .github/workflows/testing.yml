name: CI
on:
  push:
    branches:
      - ubuntu-2204-testing

jobs:
  test-ubuntu22:
    name: Project Checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:

      - name: Test ip6
        run: ip6tables -t nat -C CNI-HOSTPORT-SETMARK -m comment --comment CNI portfwd masquerade mark -j MARK --set-xmark 0x2000/0x2000 --wait
