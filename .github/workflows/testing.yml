name: CI
on:
  push:
    branches:
      - checkout-testing

jobs:
  test-checkout-actions:
    runs-on: ubuntu-latest
    name: Testing Actions checkout
    steps:
      - uses: actions/checkout@v6
        with:
          repository: kubernetes/kubernetes
          path: src/k8s.io/kubernetes
          fetch-depth: 0

      - name: Test all tags
        working-directory: ./src/k8s.io/kubernetes
        run: |
          echo "All tags"
          git tag
          echo "Count tags"
          git tag | wc -l
