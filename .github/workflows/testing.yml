name: CI
on:
  push:
    branches:
      - ubuntu-2204-testing

jobs:
  test-ubuntu22:
    name: Project Checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:

      - name: Test ip6
        run: ip6tables --set-xmark 0x2000/0x2000 --wait
